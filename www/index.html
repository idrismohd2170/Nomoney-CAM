<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#08080a">
  <title>Nomoney CAM</title>
  <link rel="stylesheet" href="vendor/glass.css">
  <link rel="stylesheet" href="ui.css">
</head>
<body>
  <!-- our own icon set: 24px grid, 1.5px round strokes -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="i-double" viewBox="0 0 24 24"><circle cx="9" cy="12" r="5.5"/><circle cx="15" cy="12" r="5.5"/></symbol>
    <symbol id="i-import" viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="14" rx="3"/><path d="M12 9v6M9 12h6"/></symbol>
    <symbol id="i-flip" viewBox="0 0 24 24"><path d="M5 9a7.5 7.5 0 0 1 13-2.5M19 4v3.5h-3.5M19 15a7.5 7.5 0 0 1-13 2.5M5 20v-3.5h3.5"/></symbol>
    <symbol id="i-set" viewBox="0 0 24 24"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
    <symbol id="i-back" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></symbol>
    <symbol id="i-save" viewBox="0 0 24 24"><path d="M12 4v9M8.5 9.5L12 13l3.5-3.5M5 14v4a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-4"/></symbol>
    <symbol id="i-share" viewBox="0 0 24 24"><path d="M12 15V4M8.5 7.5L12 4l3.5 3.5M5 12v6a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-6"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M5 7h14M10 7V5h4v2M7 7l1 12h8l1-12M10 11v5M14 11v5"/></symbol>
    <symbol id="i-torch" viewBox="0 0 24 24"><path d="M13 3L6 13.5h5L10 21l8-11h-5.5z"/></symbol>
    <symbol id="i-photo" viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="14" rx="3"/><circle cx="9" cy="10" r="1.6"/><path d="M5 17l4.5-4.5 3 3 2-2L19 16"/></symbol>
  </svg>

  <div id="view">
    <div id="stage">
      <video id="v" autoplay playsinline muted></video>
      <canvas id="vf"></canvas>
      <div id="chrome" aria-hidden="true"></div>
    </div>
    <div id="reveal" aria-hidden="true"><canvas></canvas></div>
    <div id="count" hidden aria-live="assertive"></div>
    <div id="top">
      <button id="dbl" class="ib" aria-label="Double exposure" aria-pressed="false"><svg class="ic"><use href="#i-double"/></svg></button>
      <button id="imp" class="ib" aria-label="Import photos"><svg class="ic"><use href="#i-import"/></svg></button>
      <button id="flip" class="ib" aria-label="Flip camera"><svg class="ic"><use href="#i-flip"/></svg></button>
      <button id="cog" class="ib" aria-label="Settings"><svg class="ic"><use href="#i-set"/></svg></button>
    </div>
    <input id="file" type="file" accept="image/*" multiple hidden>
    <div id="modes" aria-label="Camera modes">
      <button id="fmt" class="chip" aria-label="Frame format"></button>
      <button id="tmr" class="chip" aria-label="Self-timer"></button>
      <button id="roll" class="chip" aria-label="Film roll"></button>
      <button id="torch" class="ib" aria-label="Torch" aria-pressed="false" hidden><svg class="ic"><use href="#i-torch"/></svg></button>
    </div>
    <div id="fams" role="tablist" aria-label="Camera families"></div>
    <div id="cams" role="listbox" aria-label="Cameras"></div>
  </div>
  <div id="msg" hidden role="status"></div>
  <div id="bar">
    <div id="lastWrap" role="button" tabindex="0" aria-label="Open gallery"><svg class="ic"><use href="#i-photo"/></svg><img id="last" alt=""><span id="rollN" hidden></span></div>
    <div id="dockSlot"></div>
    <div id="acts">
      <button id="save" class="ib round" aria-label="Save to Photos"><svg class="ic"><use href="#i-save"/></svg></button>
      <button id="share" class="ib round" aria-label="Share"><svg class="ic"><use href="#i-share"/></svg></button>
    </div>
  </div>

  <section id="gal" class="sheet" hidden aria-label="Gallery">
    <header><div><span class="eyebrow">Your roll</span><h2>Gallery</h2></div><button id="galClose" class="ib round" aria-label="Close"><svg class="ic"><use href="#i-x"/></svg></button></header>
    <div id="empty" hidden>
      <svg class="sketch" viewBox="0 0 132 106" aria-hidden="true"><circle class="glow" cx="66" cy="58" r="30"/><rect x="14" y="26" width="104" height="66" rx="16"/><path d="M44 26l7-12h30l7 12"/><circle cx="66" cy="58" r="20"/><circle cx="66" cy="58" r="8"/></svg>
      <strong>No photos yet</strong>Take a shot or import one and it will wait for you here.
    </div>
    <div id="grid"></div>
  </section>

  <section id="set" class="sheet" hidden aria-label="Settings">
    <header><div><span class="eyebrow">Preferences</span><h2>Settings</h2></div><button id="setClose" class="ib round" aria-label="Close"><svg class="ic"><use href="#i-x"/></svg></button></header>
    <div class="card"><div class="row">
      <div><strong>Film development wait</strong><small>Photos appear a few seconds after the shot, like a lab. Off by default.</small></div>
      <button id="wait" class="sw" role="switch" aria-checked="false" aria-label="Film development wait"></button>
    </div></div>
  </section>

  <section id="viewer" class="sheet" hidden aria-label="Photo">
    <header><button id="viewClose" class="ib round" aria-label="Back"><svg class="ic"><use href="#i-back"/></svg></button><div><span class="eyebrow" id="viewWhen">Photo</span><h2 id="viewTitle"></h2></div></header>
    <div id="viewShell"><img id="viewImg" alt=""></div>
    <div id="viewBar">
      <button id="viewSave" class="act"><svg class="ic"><use href="#i-save"/></svg>Save</button>
      <button id="viewShare" class="act"><svg class="ic"><use href="#i-share"/></svg>Share</button>
      <button id="viewDel" class="act danger"><svg class="ic"><use href="#i-trash"/></svg>Delete</button>
    </div>
  </section>
  <script src="vendor/html2canvas.min.js"></script>
  <script src="vendor/container.js"></script>
  <script src="vendor/button.js"></script>
  <script src="film.js"></script>
  <script src="film-params.js"></script>
  <script src="cameras.js"></script>
  <script src="theme.js"></script>
  <script src="film-gl.js"></script>
  <script src="modes.js"></script>
  <script src="store.js"></script>
  <script>
    const v = document.getElementById('v'), msg = document.getElementById('msg'), viewEl = document.getElementById('view');
    const last = document.getElementById('last'), bar = document.getElementById('bar');

    // remembered across restarts: camera, frame format, timer and the open roll
    const MODE_KEY = 'nomoney.mode';
    let saved = {};
    try { saved = JSON.parse(localStorage.getItem(MODE_KEY)) || {}; } catch (e) { /* storage unavailable: defaults */ }
    let cam = CAMERAS[saved.cam] ? saved.cam : 0, facing = 'environment', stream = null;
    let fmt = FORMATS.find(f => f.id === saved.fmt) || FORMATS[0];
    let timer = TIMERS.includes(saved.timer) ? saved.timer : 0;
    let roll = saved.roll && ROLLS.includes(saved.roll.size) && saved.roll.n < saved.roll.size ? saved.roll : null;
    const persist = () => { try { localStorage.setItem(MODE_KEY, JSON.stringify({ cam, fmt: fmt.id, timer, roll })); } catch (e) { /* not persisted */ } };
    const gpu = createRenderer();                             // offscreen, full-resolution capture
    const vf = createRenderer(document.getElementById('vf')); // live viewfinder, same shader
    const newLook = () => makeParams(CAMERAS[cam], Date.now());
    let next = newLook(); // the look of the next shot: the viewfinder shows it, so the photo matches what you saw

    let torchOn = false;
    // Moderate-size preview stream keeps the shader fast; the photo itself is taken at full size in still().
    const startCamera = async () => {
      if (stream) stream.getTracks().forEach(t => t.stop());
      try {
        stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: facing, width: { ideal: 1280 }, aspectRatio: { ideal: 4 / 3 } }, audio: false });
        v.srcObject = stream;
        viewEl.classList.toggle('front', facing === 'user');
        const track = stream.getVideoTracks()[0], caps = track.getCapabilities ? track.getCapabilities() : {};
        torchOn = false;
        const tb = document.getElementById('torch');
        tb.hidden = !caps.torch; tb.classList.remove('on'); tb.setAttribute('aria-pressed', 'false');
        msg.hidden = true;
      } catch (e) { msg.hidden = false; msg.textContent = 'Camera unavailable: ' + e.name; }
    };
    startCamera();

    // The stage is the picture area: the chosen format's shape, centred in the view. Photos are cropped to the same shape.
    const stage = document.getElementById('stage');
    const layout = () => {
      const s = stageSize(viewEl.clientWidth, viewEl.clientHeight, frameAspect(fmt, v.videoWidth || 4, v.videoHeight || 3));
      stage.style.width = s.w + 'px'; stage.style.height = s.h + 'px';
    };
    v.addEventListener('loadedmetadata', layout); v.addEventListener('resize', layout); addEventListener('resize', layout);
    layout();
    const cropTo = (src, a) => {
      const r = cropRect(src.videoWidth || src.width, src.videoHeight || src.height, a);
      const c = document.createElement('canvas'); c.width = r.w; c.height = r.h;
      c.getContext('2d').drawImage(src, r.x, r.y, r.w, r.h, 0, 0, r.w, r.h);
      return c;
    };

    // Draw every new camera frame through the film shader. Without WebGL the plain video shows underneath.
    const tick = () => {
      if (vf.ok && v.videoWidth) vf.render(v, next);
      v.requestVideoFrameCallback ? v.requestVideoFrameCallback(tick) : requestAnimationFrame(tick);
    };
    tick();

    // Full-resolution photo when the browser supports ImageCapture, otherwise the current preview frame.
    const still = async () => {
      const track = stream && stream.getVideoTracks()[0];
      if (window.ImageCapture && track) {
        try {
          const bmp = await createImageBitmap(await new ImageCapture(track).takePhoto());
          const c = document.createElement('canvas'); // WebGL ignores its flip flag for bitmaps, so go through a 2D canvas
          c.width = bmp.width; c.height = bmp.height;
          c.getContext('2d').drawImage(bmp, 0, 0);
          bmp.close();
          return c;
        } catch (e) { /* fall through to the preview frame */ }
      }
      return v;
    };

    // Double exposure: the first press keeps the raw frame (shown faintly in the viewfinder), the second blends the
    // two and develops the result once. mode is 'screen' (adds light) or 'lighten' (brightest of the two wins).
    let dbl = false, held = null;
    const blend = (a, b, mode) => {
      const c = document.createElement('canvas');
      c.width = a.width; c.height = a.height;
      const x = c.getContext('2d');
      x.drawImage(a, 0, 0);
      x.globalCompositeOperation = mode;
      x.drawImage(b, 0, 0, a.width, a.height);
      return c;
    };
    const clearHeld = () => { if (held) held.remove(); held = null; };

    // Every shot is stored as a blob in IndexedDB (see store.js); `latest` also keeps the newest one in memory.
    const toBlob = (c, q) => new Promise(r => c.toBlob(r, 'image/jpeg', q));
    let latest = null, lastUrl = null;
    const showLast = blob => { if (lastUrl) URL.revokeObjectURL(lastUrl); last.src = lastUrl = URL.createObjectURL(blob); };
    const note = t => { msg.hidden = false; msg.textContent = t; setTimeout(() => { msg.hidden = true; }, 3000); };
    // Optional development wait: the photo is taken at once but shows up (and is stored) a few seconds later.
    const DEV_MS = 3000;
    let waitOn = false;
    try { waitOn = localStorage.getItem('nomoney.wait') === '1'; } catch (e) { /* storage unavailable: stays off */ }
    const keep = async (c, delay = 0) => {
      const t0 = Date.now();
      if (delay > 0) last.classList.add('developing'); // feedback from the moment of the shot, not after encoding
      const blob = await toBlob(c, 0.92);
      const tc = document.createElement('canvas'), k = 256 / Math.max(c.width, c.height);
      tc.width = Math.round(c.width * k); tc.height = Math.round(c.height * k);
      tc.getContext('2d').drawImage(c, 0, 0, tc.width, tc.height);
      const rec = { id: Date.now() + '-' + Math.random().toString(36).slice(2, 6), t: Date.now(), cam: CAMERAS[cam].name, roll: roll ? roll.id : undefined, thumb: await toBlob(tc, 0.8) };
      const commit = async () => {
        latest = { rec, blob };
        last.classList.remove('developing');
        try { await shotStore.add(rec, blob); } catch (e) { note('Could not store the photo: ' + (e.message || e)); }
        if (!rec.roll) { showLast(rec.thumb); return; }
        // on a roll the thumbnail stays put: the counter shows progress and the whole roll appears when the last frame is used
        if (roll && roll.id === rec.roll) {
          const r = rollNext(roll); roll = r.roll; persist(); showRoll();
          if (r.done) { const size = roll.size; roll = null; persist(); showRoll(); showNewest(); note('Roll finished: ' + size + ' photos developed'); }
        }
      };
      if (delay > 0) setTimeout(commit, Math.max(0, delay - (Date.now() - t0))); else await commit();
    };
    // restore the newest thumbnail after a restart
    const visible = list => list.filter(r => !(roll && r.roll === roll.id)); // an open roll stays hidden until it is finished
    const showNewest = () => shotStore.all().then(visible).then(list => { if (list[0]) showLast(list[0].thumb); else { last.removeAttribute('src'); lastUrl = null; } }).catch(() => {});
    showNewest();

    // Develops a picture (video frame or canvas) with the look in `next`; used by the shutter and by import.
    const burn = (src, p) => { // orange date stamp on a 2D copy (a WebGL canvas cannot take 2D drawing)
      if (!p.stamp) return src;
      const c = document.createElement('canvas'), x = c.getContext('2d'), b = stampBox(src.width, src.height);
      c.width = src.width; c.height = src.height;
      x.drawImage(src, 0, 0);
      x.font = `700 ${b.size}px ui-monospace, monospace`; x.textAlign = 'right';
      x.shadowColor = 'rgba(255,110,20,.85)'; x.shadowBlur = b.size * 0.4; x.fillStyle = '#ff8a1f';
      x.fillText(stampText(new Date()), b.x, b.y);
      return c;
    };
    const printEl = document.getElementById('reveal'), printCv = printEl.firstElementChild;
    const showPrint = c => { // small copy of the developed shot, animated by CSS; not part of saving
      const k = 360 / Math.max(c.width, c.height);
      printCv.width = Math.round(c.width * k); printCv.height = Math.round(c.height * k);
      printCv.getContext('2d').drawImage(c, 0, 0, printCv.width, printCv.height);
      printEl.classList.remove('go'); void printEl.offsetWidth; printEl.classList.add('go');
    };
    const finish = src => {
      if (gpu.ok) { gpu.render(src, next); return burn(gpu.canvas, next); }
      const c = document.createElement('canvas'); // no WebGL: slower CPU look
      c.width = src.videoWidth || src.width; c.height = src.videoHeight || src.height;
      const ctx = c.getContext('2d');
      ctx.drawImage(src, 0, 0);
      ctx.putImageData(develop(ctx.getImageData(0, 0, c.width, c.height), next, Date.now()), 0, 0);
      return burn(c, next);
    };

    let busy = false;
    const shoot = async () => {
      if (busy || !v.videoWidth) return;
      busy = true;
      let made = false;
      try {
        const raw = await still();
        const one = cropTo(raw, frameAspect(fmt, raw.videoWidth || raw.width, raw.videoHeight || raw.height));
        let src = one;
        if (fmt.fixed || dbl) { // two-press modes: half frame (side by side) or double exposure (blend)
          if (!held) { // first frame: keep it and wait for the second
            held = one; held.id = 'ghost';
            document.getElementById('vf').after(held);
            return;
          }
          if (fmt.fixed) {
            src = document.createElement('canvas'); src.width = held.width * 2; src.height = held.height;
            const x = src.getContext('2d');
            x.drawImage(held, 0, 0); x.drawImage(one, held.width, 0, held.width, held.height);
          } else src = blend(held, one, Math.random() < 0.5 ? 'screen' : 'lighten');
          clearHeld();
        }
        const done = finish(src);
        if (CAMERAS[cam].ui === 'print') showPrint(done);
        await keep(done, waitOn ? DEV_MS : 0);
        made = true;
      } finally {
        busy = false;
        if (made) setTimeout(() => { next = newLook(); }, 0); // fresh dust, leak and frame for the next shot
      }
    };

    // Self-timer: the shutter starts a countdown; pressing it again cancels.
    let counting = null;
    const countEl = document.getElementById('count');
    const press = () => {
      if (counting) { clearInterval(counting); counting = null; countEl.hidden = true; note('Cancelled'); return; }
      if (!timer) return shoot();
      let n = timer;
      countEl.hidden = false; countEl.textContent = n;
      counting = setInterval(() => {
        if (--n > 0) { countEl.textContent = n; return; }
        clearInterval(counting); counting = null; countEl.hidden = true; shoot();
      }, 1000);
    };

    // Import: each chosen photo gets the selected camera's look, with a fresh random look per photo.
    const picker = document.getElementById('file');
    document.getElementById('imp').onclick = () => picker.click();
    picker.onchange = async () => {
      if (busy) return;
      busy = true;
      let n = 0;
      try {
        for (const f of picker.files) {
          try {
            const bmp = await createImageBitmap(f, { imageOrientation: 'from-image' });
            const c = document.createElement('canvas'); // through a 2D canvas: WebGL ignores the flip flag for bitmaps
            c.width = bmp.width; c.height = bmp.height;
            c.getContext('2d').drawImage(bmp, 0, 0);
            bmp.close();
            await keep(finish(c));
            next = newLook();
            n++;
          } catch (e) { note('Could not open ' + f.name); }
        }
      } finally { busy = false; picker.value = ''; }
      if (n) note(n === 1 ? 'Photo imported' : n + ' photos imported');
    };

    const dblBtn = document.getElementById('dbl');
    dblBtn.onclick = () => {
      if (fmt.fixed) { note('Double exposure is off in Half mode'); return; }
      dbl = !dbl;
      dblBtn.classList.toggle('on', dbl);
      dblBtn.setAttribute('aria-pressed', dbl);
      clearHeld(); // switching the mode off, or on again, drops a half-finished pair
    };

    document.getElementById('flip').onclick = () => { clearHeld(); facing = facing === 'user' ? 'environment' : 'user'; startCamera(); };

    // Hands a photo to the system share sheet, which also offers "save to device".
    const b64 = blob => new Promise(r => { const f = new FileReader(); f.onload = () => r(f.result.split(',')[1]); f.readAsDataURL(blob); });
    const shareBlob = async blob => {
      if (!blob) return;
      const cap = window.Capacitor;
      if (!cap || !cap.isNativePlatform || !cap.isNativePlatform()) { note('Sharing works in the Android app'); return; }
      try {
        const { uri } = await cap.Plugins.Filesystem.writeFile({ path: 'shot-' + Date.now() + '.jpg', data: await b64(blob), directory: 'CACHE' });
        await cap.Plugins.Share.share({ files: [uri] });
      } catch (e) {
        if (!/cancel/i.test(e.message || '')) note('Share failed: ' + (e.message || e));
      }
    };
    const share = () => shareBlob(latest && latest.blob);

    // Save puts the JPEG into the phone's Pictures (Photos app) through the GallerySaver plugin; in a browser it downloads the file.
    const saveBlob = async (blob, name) => {
      if (!blob) return;
      name = name || 'NomoneyCAM-' + Date.now() + '.jpg';
      const cap = window.Capacitor;
      if (!cap || !cap.isNativePlatform || !cap.isNativePlatform()) {
        const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; a.click();
        setTimeout(() => URL.revokeObjectURL(a.href), 1000); note('Downloaded ' + name); return;
      }
      try { await cap.Plugins.GallerySaver.save({ data: await b64(blob), name }); note('Saved to Pictures/NomoneyCAM'); }
      catch (e) { note('Save failed: ' + (e.message || e)); }
    };
    const save = () => saveBlob(latest && latest.blob, latest && latest.rec.id + '.jpg');

    // Gallery: grid of stored thumbnails, tap one to view, share or delete it.
    const $ = id => document.getElementById(id);
    // The camera's theme restyles the viewfinder and the bottom bar only; gallery and settings keep the neutral root tokens.
    const applyTheme = c => {
      const t = themeOf(c);
      for (const el of [$('view'), $('bar')]) { el.dataset.ui = t.ui; for (const k in t.vars) el.style.setProperty(k, t.vars[k]); }
    };
    applyTheme(CAMERAS[cam]);
    const gal = $('gal'), grid = $('grid'), viewer = $('viewer'), viewImg = $('viewImg');
    let gridUrls = [], current = null, viewUrl = null;
    const drop = urls => { urls.forEach(u => URL.revokeObjectURL(u)); urls.length = 0; };
    const openGallery = async () => {
      gal.hidden = false;
      let list = [];
      try { list = visible(await shotStore.all()); } catch (e) { note('Could not read the gallery: ' + (e.message || e)); }
      drop(gridUrls); grid.textContent = '';
      $('empty').hidden = list.length > 0;
      list.forEach(rec => {
        const im = new Image(); im.alt = rec.cam + ' photo'; im.src = URL.createObjectURL(rec.thumb); gridUrls.push(im.src);
        im.onclick = () => openViewer(rec);
        grid.appendChild(im);
      });
    };
    const closeGallery = () => { gal.hidden = true; drop(gridUrls); grid.textContent = ''; };
    const openViewer = async rec => {
      const blob = await shotStore.full(rec.id);
      if (!blob) { note('Photo data is missing'); return; }
      current = { rec, blob };
      if (viewUrl) URL.revokeObjectURL(viewUrl);
      viewImg.src = viewUrl = URL.createObjectURL(blob);
      $('viewTitle').textContent = rec.cam; $('viewWhen').textContent = new Date(rec.t).toLocaleString([], { dateStyle: 'medium', timeStyle: 'short' });
      viewer.hidden = false;
    };
    const closeViewer = () => { viewer.hidden = true; viewImg.removeAttribute('src'); if (viewUrl) URL.revokeObjectURL(viewUrl); viewUrl = null; current = null; };
    const lastWrap = $('lastWrap');
    lastWrap.onclick = openGallery;
    lastWrap.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') openGallery(); };
    $('galClose').onclick = closeGallery;
    $('viewClose').onclick = closeViewer;
    $('viewSave').onclick = () => saveBlob(current && current.blob, current && current.rec.id + '.jpg');
    $('viewShare').onclick = () => shareBlob(current && current.blob);
    $('viewDel').onclick = async () => {
      if (!current || !confirm('Delete this photo?')) return;
      try { await shotStore.remove(current.rec.id); } catch (e) { note('Delete failed: ' + (e.message || e)); return; }
      if (latest && latest.rec.id === current.rec.id) latest = null;
      closeViewer(); await openGallery();
      showNewest();
    };

    // Settings sheet
    const setEl = $('set'), waitBtn = $('wait');
    const showWait = () => { waitBtn.setAttribute('aria-checked', waitOn); };
    showWait();
    $('cog').onclick = () => { setEl.hidden = false; };
    $('setClose').onclick = () => { setEl.hidden = true; };
    waitBtn.onclick = () => {
      waitOn = !waitOn; showWait();
      try { localStorage.setItem('nomoney.wait', waitOn ? '1' : '0'); } catch (e) { /* not persisted */ }
    };

    // Picker: a row of family tabs and, under it, the chips of the active family. Choosing a tab picks that family's last camera,
    // so the active camera is always on screen and every change is one tap.
    const cams = document.getElementById('cams'), famEl = document.getElementById('fams');
    const fams = camFamilies(CAMERAS), famOf = i => fams.findIndex(f => f.idx.includes(i)), lastIn = {};
    const showCams = smooth => {
      const fi = famOf(cam);
      famEl.querySelectorAll('.chip').forEach((x, j) => { x.classList.toggle('on', j === fi); x.setAttribute('aria-selected', j === fi); });
      if (cams.dataset.fam !== String(fi)) { // another family: build its chips
        cams.dataset.fam = fi;
        cams.replaceChildren(...fams[fi].idx.map(i => {
          const b = document.createElement('button');
          b.className = 'chip'; b.textContent = CAMERAS[i].name; b.setAttribute('role', 'option');
          b.onclick = () => choose(i);
          b.dataset.i = i;
          return b;
        }));
      }
      cams.querySelectorAll('.chip').forEach(x => { const on = +x.dataset.i === cam; x.classList.toggle('on', on); x.setAttribute('aria-selected', on); });
      cams.querySelector('.on').scrollIntoView({ inline: 'center', block: 'nearest', behavior: smooth ? 'smooth' : 'auto' });
    };
    const choose = i => {
      const c = CAMERAS[i];
      cam = i; lastIn[famOf(i)] = i;
      next = newLook();
      applyTheme(c);
      if (c.fmt) { fmt = FORMATS.find(f => f.id === c.fmt); clearHeld(); layout(); showModes(); } // instant cameras bring their print shape
      showCams(cams.dataset.fam === String(famOf(i)));
      persist();
    };
    fams.forEach((f, j) => {
      const b = document.createElement('button');
      b.className = 'chip'; b.textContent = f.name; b.setAttribute('role', 'tab');
      b.onclick = () => choose(lastIn[j] ?? f.idx[0]);
      famEl.appendChild(b);
    });
    lastIn[famOf(cam)] = cam;
    showCams(false);

    // Mode chips: tap to step through the values. Active (non-default) values light up.
    const fmtBtn = $('fmt'), tmrBtn = $('tmr'), rollBtn = $('roll'), rollN = $('rollN'), torchBtn = $('torch');
    const showModes = () => {
      fmtBtn.textContent = fmt.label; fmtBtn.classList.toggle('on', fmt !== FORMATS[0]);
      tmrBtn.textContent = timer ? 'Timer ' + timer + 's' : 'Timer'; tmrBtn.classList.toggle('on', !!timer);
      rollBtn.textContent = roll ? 'Roll ' + roll.size : 'Roll'; rollBtn.classList.toggle('on', !!roll);
    };
    const showRoll = () => { showModes(); rollN.hidden = !roll; if (roll) rollN.textContent = roll.n + '/' + roll.size; };
    fmtBtn.onclick = () => { fmt = nextIn(FORMATS, fmt); clearHeld(); layout(); showModes(); persist(); };
    tmrBtn.onclick = () => { timer = nextIn(TIMERS, timer); showModes(); persist(); };
    rollBtn.onclick = () => {
      const size = nextIn(ROLLS, roll ? roll.size : 0), was = roll;
      roll = size ? { id: 'r' + Date.now(), size, n: 0 } : null; // a new setting starts a fresh roll and ends the old one
      showRoll(); persist(); if (was) showNewest();
    };
    torchBtn.onclick = async () => {
      const t = stream && stream.getVideoTracks()[0];
      try { await t.applyConstraints({ advanced: [{ torch: !torchOn }] }); torchOn = !torchOn; }
      catch (e) { note('Torch not available'); }
      torchBtn.classList.toggle('on', torchOn); torchBtn.setAttribute('aria-pressed', torchOn);
    };
    showRoll();

    const dock = new Container({ type: 'pill', borderRadius: 48, tintOpacity: 0.25 });
    const shutter = new Button({ text: '\u25CF', size: 28, type: 'circle', onClick: press });
    dock.addChild(shutter);
    shutter.element.id = 'shutter';
    shutter.textElement.innerHTML = '<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"/><circle class="dot" cx="12" cy="12" r="6"/></svg>';
    shutter.element.setAttribute('aria-label', 'Take photo');
    $('dockSlot').appendChild(dock.element);
    $('save').onclick = save;
    $('share').onclick = share;
  </script>
</body>
</html>
