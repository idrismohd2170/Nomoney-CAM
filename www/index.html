<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Nomoney CAM</title>
  <link rel="stylesheet" href="vendor/glass.css">
  <style>
    html, body { margin: 0; height: 100%; background: #111; color: #eee; font: 16px system-ui, sans-serif; }
    body { display: flex; flex-direction: column; }
    #view { position: relative; flex: 1; min-height: 0; }
    video, #vf { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
    #view.front video, #view.front #vf, #view.front #ghost { transform: scaleX(-1); }
    #flip { position: absolute; top: 10px; right: 12px; }
    #dbl { position: absolute; top: 10px; left: 12px; }
    #ghost { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: .4; pointer-events: none; }
    /* frosted chips over the live view: backdrop-filter works on live content, unlike the glass library's still snapshot */
    #cams { position: absolute; left: 0; right: 0; bottom: 10px; display: flex; gap: 8px; padding: 0 12px;
            overflow-x: auto; scrollbar-width: none; scroll-snap-type: x proximity; }
    #cams::-webkit-scrollbar { display: none; }
    .chip { flex: none; scroll-snap-align: center; padding: 8px 16px; border-radius: 999px; border: 1px solid rgba(255,255,255,.28);
            background: rgba(255,255,255,.12); color: #fff; font: 15px system-ui, sans-serif;
            -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); }
    .chip.on { background: rgba(255,255,255,.34); border-color: #fff; }
    /* glass samples a snapshot of the page, so it lives on this static bar, never over the live video */
    #bar { display: flex; align-items: center; justify-content: center; gap: 12px; padding: 16px 12px 24px;
           background: linear-gradient(135deg, #1d2b4f, #4a2b5c 60%, #7a3b4e); }
    #bar .glass-container { gap: 6px; padding: 6px; }
    #last { width: 40px; height: 40px; object-fit: cover; border-radius: 8px; background: #222; }
    #msg { text-align: center; padding: 8px; }
    #last { cursor: pointer; }
    /* gallery: full-screen grid, and a viewer over it */
    .sheet { position: fixed; inset: 0; z-index: 10; display: flex; flex-direction: column; background: #111; }
    [hidden] { display: none !important; }
    .sheet header { display: flex; align-items: center; justify-content: space-between; padding: 12px; }
    .sheet h2 { margin: 0; font-size: 18px; font-weight: 600; }
    .sheet button { font: 15px system-ui, sans-serif; color: #fff; background: rgba(255,255,255,.14); border: 1px solid rgba(255,255,255,.28); border-radius: 999px; padding: 8px 16px; }
    #grid { flex: 1; overflow-y: auto; display: grid; grid-template-columns: repeat(3, 1fr); gap: 2px; align-content: start; }
    #grid img { width: 100%; aspect-ratio: 1; object-fit: cover; background: #222; }
    #empty { flex: 1; display: flex; align-items: center; justify-content: center; color: #999; }
    #viewImg { flex: 1; min-height: 0; width: 100%; object-fit: contain; }
    #viewBar { display: flex; justify-content: center; gap: 10px; padding: 14px 12px 24px; }
    #viewBar .danger { background: rgba(220,60,60,.45); }
  </style>
</head>
<body>
  <div id="view">
    <video id="v" autoplay playsinline muted></video>
    <canvas id="vf"></canvas>
    <button id="flip" class="chip" aria-label="Flip camera">Flip</button>
    <button id="dbl" class="chip" aria-label="Double exposure" aria-pressed="false">Double</button>
    <div id="cams" role="listbox" aria-label="Cameras"></div>
  </div>
  <div id="msg" hidden></div>
  <div id="bar">
    <img id="last" alt="Open gallery" role="button" tabindex="0">
  </div>
  <section id="gal" class="sheet" hidden aria-label="Gallery">
    <header><h2>Gallery</h2><button id="galClose">Close</button></header>
    <div id="empty" hidden>No photos yet</div>
    <div id="grid"></div>
  </section>
  <section id="viewer" class="sheet" hidden aria-label="Photo">
    <header><h2 id="viewTitle"></h2><button id="viewClose">Back</button></header>
    <img id="viewImg" alt="">
    <div id="viewBar">
      <button id="viewSave">Save</button>
      <button id="viewShare">Share</button>
      <button id="viewDel">Delete</button>
    </div>
  </section>
  <script src="vendor/html2canvas.min.js"></script>
  <script src="vendor/container.js"></script>
  <script src="vendor/button.js"></script>
  <script src="film.js"></script>
  <script src="film-params.js"></script>
  <script src="cameras.js"></script>
  <script src="film-gl.js"></script>
  <script src="store.js"></script>
  <script>
    const v = document.getElementById('v'), msg = document.getElementById('msg'), viewEl = document.getElementById('view');
    const last = document.getElementById('last'), bar = document.getElementById('bar');

    let cam = 0, facing = 'environment', stream = null;
    const gpu = createRenderer();                             // offscreen, full-resolution capture
    const vf = createRenderer(document.getElementById('vf')); // live viewfinder, same shader
    const newLook = () => makeParams(CAMERAS[cam], Date.now());
    let next = newLook(); // the look of the next shot: the viewfinder shows it, so the photo matches what you saw

    // Moderate-size preview stream keeps the shader fast; the photo itself is taken at full size in still().
    const startCamera = async () => {
      if (stream) stream.getTracks().forEach(t => t.stop());
      try {
        stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: facing, width: { ideal: 1280 }, aspectRatio: { ideal: 4 / 3 } }, audio: false });
        v.srcObject = stream;
        viewEl.classList.toggle('front', facing === 'user');
        msg.hidden = true;
      } catch (e) { msg.hidden = false; msg.textContent = 'Camera unavailable: ' + e.name; }
    };
    startCamera();

    // Draw every new camera frame through the film shader. Without WebGL the plain video shows underneath.
    const tick = () => {
      if (vf.ok && v.videoWidth) vf.render(v, next);
      v.requestVideoFrameCallback ? v.requestVideoFrameCallback(tick) : requestAnimationFrame(tick);
    };
    tick();

    // Full-resolution photo when the browser supports ImageCapture, otherwise the current preview frame.
    const still = async () => {
      const track = stream && stream.getVideoTracks()[0];
      if (window.ImageCapture && track) {
        try {
          const bmp = await createImageBitmap(await new ImageCapture(track).takePhoto());
          const c = document.createElement('canvas'); // WebGL ignores its flip flag for bitmaps, so go through a 2D canvas
          c.width = bmp.width; c.height = bmp.height;
          c.getContext('2d').drawImage(bmp, 0, 0);
          bmp.close();
          return c;
        } catch (e) { /* fall through to the preview frame */ }
      }
      return v;
    };

    // Double exposure: the first press keeps the raw frame (shown faintly in the viewfinder), the second blends the
    // two and develops the result once. mode is 'screen' (adds light) or 'lighten' (brightest of the two wins).
    let dbl = false, held = null;
    const toCanvas = src => {
      if (src instanceof HTMLCanvasElement) return src;
      const c = document.createElement('canvas');
      c.width = src.videoWidth || src.width; c.height = src.videoHeight || src.height;
      c.getContext('2d').drawImage(src, 0, 0);
      return c;
    };
    const blend = (a, b, mode) => {
      const c = document.createElement('canvas');
      c.width = a.width; c.height = a.height;
      const x = c.getContext('2d');
      x.drawImage(a, 0, 0);
      x.globalCompositeOperation = mode;
      x.drawImage(b, 0, 0, a.width, a.height);
      return c;
    };
    const clearHeld = () => { if (held) held.remove(); held = null; };

    // Every shot is stored as a blob in IndexedDB (see store.js); `latest` also keeps the newest one in memory.
    const toBlob = (c, q) => new Promise(r => c.toBlob(r, 'image/jpeg', q));
    let latest = null, lastUrl = null;
    const showLast = blob => { if (lastUrl) URL.revokeObjectURL(lastUrl); last.src = lastUrl = URL.createObjectURL(blob); };
    const note = t => { msg.hidden = false; msg.textContent = t; setTimeout(() => { msg.hidden = true; }, 3000); };
    const keep = async c => {
      const blob = await toBlob(c, 0.92);
      const tc = document.createElement('canvas'), k = 256 / Math.max(c.width, c.height);
      tc.width = Math.round(c.width * k); tc.height = Math.round(c.height * k);
      tc.getContext('2d').drawImage(c, 0, 0, tc.width, tc.height);
      const rec = { id: Date.now() + '-' + Math.random().toString(36).slice(2, 6), t: Date.now(), cam: CAMERAS[cam].name, thumb: await toBlob(tc, 0.8) };
      latest = { rec, blob };
      showLast(rec.thumb);
      try { await shotStore.add(rec, blob); } catch (e) { note('Could not store the photo: ' + (e.message || e)); }
    };
    // restore the newest thumbnail after a restart
    shotStore.all().then(list => { if (list[0] && !latest) { showLast(list[0].thumb); } }).catch(() => {});

    let busy = false;
    const shoot = async () => {
      if (busy || !v.videoWidth) return;
      busy = true;
      let made = false;
      try {
        let src = await still();
        if (dbl) {
          if (!held) { // first exposure: keep it and wait for the second
            held = toCanvas(src); held.id = 'ghost';
            document.getElementById('vf').after(held);
            return;
          }
          src = blend(held, toCanvas(src), Math.random() < 0.5 ? 'screen' : 'lighten');
          clearHeld();
        }
        const p = next;
        let c;
        if (gpu.ok) { gpu.render(src, p); c = gpu.canvas; }
        else { // no WebGL: slower CPU look
          c = document.createElement('canvas');
          c.width = src.videoWidth || src.width; c.height = src.videoHeight || src.height;
          const ctx = c.getContext('2d');
          ctx.drawImage(src, 0, 0);
          ctx.putImageData(develop(ctx.getImageData(0, 0, c.width, c.height), p, Date.now()), 0, 0);
        }
        await keep(c);
        made = true;
      } finally {
        busy = false;
        if (made) setTimeout(() => { next = newLook(); }, 0); // fresh dust, leak and frame for the next shot
      }
    };

    const dblBtn = document.getElementById('dbl');
    dblBtn.onclick = () => {
      dbl = !dbl;
      dblBtn.classList.toggle('on', dbl);
      dblBtn.setAttribute('aria-pressed', dbl);
      clearHeld(); // switching the mode off, or on again, drops a half-finished pair
    };

    document.getElementById('flip').onclick = () => { clearHeld(); facing = facing === 'user' ? 'environment' : 'user'; startCamera(); };

    // Hands a photo to the system share sheet, which also offers "save to device".
    const b64 = blob => new Promise(r => { const f = new FileReader(); f.onload = () => r(f.result.split(',')[1]); f.readAsDataURL(blob); });
    const shareBlob = async blob => {
      if (!blob) return;
      const cap = window.Capacitor;
      if (!cap || !cap.isNativePlatform || !cap.isNativePlatform()) { note('Sharing works in the Android app'); return; }
      try {
        const { uri } = await cap.Plugins.Filesystem.writeFile({ path: 'shot-' + Date.now() + '.jpg', data: await b64(blob), directory: 'CACHE' });
        await cap.Plugins.Share.share({ files: [uri] });
      } catch (e) {
        if (!/cancel/i.test(e.message || '')) note('Share failed: ' + (e.message || e));
      }
    };
    const share = () => shareBlob(latest && latest.blob);

    // Save puts the JPEG into the phone's Pictures (Photos app) through the GallerySaver plugin; in a browser it downloads the file.
    const saveBlob = async (blob, name) => {
      if (!blob) return;
      name = name || 'NomoneyCAM-' + Date.now() + '.jpg';
      const cap = window.Capacitor;
      if (!cap || !cap.isNativePlatform || !cap.isNativePlatform()) {
        const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; a.click();
        setTimeout(() => URL.revokeObjectURL(a.href), 1000); note('Downloaded ' + name); return;
      }
      try { await cap.Plugins.GallerySaver.save({ data: await b64(blob), name }); note('Saved to Pictures/NomoneyCAM'); }
      catch (e) { note('Save failed: ' + (e.message || e)); }
    };
    const save = () => saveBlob(latest && latest.blob, latest && latest.rec.id + '.jpg');

    // Gallery: grid of stored thumbnails, tap one to view, share or delete it.
    const $ = id => document.getElementById(id);
    const gal = $('gal'), grid = $('grid'), viewer = $('viewer'), viewImg = $('viewImg');
    let gridUrls = [], current = null, viewUrl = null;
    const drop = urls => { urls.forEach(u => URL.revokeObjectURL(u)); urls.length = 0; };
    const openGallery = async () => {
      gal.hidden = false;
      let list = [];
      try { list = await shotStore.all(); } catch (e) { note('Could not read the gallery: ' + (e.message || e)); }
      drop(gridUrls); grid.textContent = '';
      $('empty').hidden = list.length > 0;
      list.forEach(rec => {
        const im = new Image(); im.alt = rec.cam + ' photo'; im.src = URL.createObjectURL(rec.thumb); gridUrls.push(im.src);
        im.onclick = () => openViewer(rec);
        grid.appendChild(im);
      });
    };
    const closeGallery = () => { gal.hidden = true; drop(gridUrls); grid.textContent = ''; };
    const openViewer = async rec => {
      const blob = await shotStore.full(rec.id);
      if (!blob) { note('Photo data is missing'); return; }
      current = { rec, blob };
      if (viewUrl) URL.revokeObjectURL(viewUrl);
      viewImg.src = viewUrl = URL.createObjectURL(blob);
      $('viewTitle').textContent = rec.cam + ' \u00B7 ' + new Date(rec.t).toLocaleString();
      viewer.hidden = false;
    };
    const closeViewer = () => { viewer.hidden = true; viewImg.removeAttribute('src'); if (viewUrl) URL.revokeObjectURL(viewUrl); viewUrl = null; current = null; };
    last.onclick = openGallery;
    last.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') openGallery(); };
    $('galClose').onclick = closeGallery;
    $('viewClose').onclick = closeViewer;
    $('viewSave').onclick = () => saveBlob(current && current.blob, current && current.rec.id + '.jpg');
    $('viewShare').onclick = () => shareBlob(current && current.blob);
    $('viewDel').onclick = async () => {
      if (!current || !confirm('Delete this photo?')) return;
      try { await shotStore.remove(current.rec.id); } catch (e) { note('Delete failed: ' + (e.message || e)); return; }
      if (latest && latest.rec.id === current.rec.id) latest = null;
      closeViewer(); await openGallery();
      const list = await shotStore.all().catch(() => []);
      if (list[0]) showLast(list[0].thumb); else { last.removeAttribute('src'); lastUrl = null; }
    };

    const cams = document.getElementById('cams');
    CAMERAS.forEach((c, i) => {
      const b = document.createElement('button');
      b.className = 'chip' + (i === cam ? ' on' : '');
      b.textContent = c.name;
      b.onclick = () => {
        cam = i;
        next = newLook();
        cams.querySelectorAll('.chip').forEach((x, j) => x.classList.toggle('on', j === i));
        b.scrollIntoView({ inline: 'center', block: 'nearest', behavior: 'smooth' });
      };
      cams.appendChild(b);
    });

    const dock = new Container({ type: 'pill', borderRadius: 48, tintOpacity: 0.25 });
    dock.addChild(new Button({ text: '\u25CF', size: 28, type: 'circle', onClick: shoot }));
    dock.addChild(new Button({ text: 'Save', size: 18, type: 'pill', onClick: save }));
    dock.addChild(new Button({ text: 'Share', size: 18, type: 'pill', onClick: share }));
    bar.appendChild(dock.element);
  </script>
</body>
</html>
